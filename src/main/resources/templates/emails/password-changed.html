<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<body style="font-family: Arial, Helvetica, sans-serif; color: #1a1a1a; line-height: 1.6;">
<div style="max-width: 520px; margin: 0 auto; padding: 24px;">
    <h2>Your password was changed</h2>
    <p>Hi <span th:text="${name} ?: 'there'">there</span>,</p>
    <p>The password on your account was just changed. If this was you, nothing further is needed.</p>
    <p><strong>If this wasn't you, contact our support team immediately.</strong></p>
</div>
</body>
</html>
