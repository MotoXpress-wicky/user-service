spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Flyway creates the tables. Hibernate only checks that they match the entities.
      ddl-auto: validate

  rabbitmq:
    template:
      # Sending an event is tried 3 times before it is given up.
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 500ms


  security:
    oauth2:
      client:
        registration:
          google:
            clientId: ${GOOGLE_CLIENT_ID}
            clientSecret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            # Spring listens to this exact URL by default to catch Google's redirect. Do not need to manually create
            # callback route like we do in node.js
            # used to catch authoization code from Google'
            redirectUri: "{baseUrl}/login/oauth2/code/{registrationId}"

auth:
  token:
    secret: ${JWT_SECRET}
    ttl-minutes: 15            # 15 minutes
  cookie:
    name: access_token
    path: /
    ttl-minutes: 20160      # 14 days
    secure: false
    same-site: Lax

refresh:
  token:
    ttl-minutes: 20160          # 14 days
  cookie:
    name: refresh_token
    path: /api/v1/user/auth
    ttl-minutes: 20160          # 14 days
    secure: false
    same-site: Lax

frontend:
  failure-redirect-url: "${FRONTEND_URL:http://localhost}/login"
  success-redirect-url: "${FRONTEND_URL:http://localhost}/"

cors:
  # Nginx serves the UI and the API on one origin, so CORS is not used
  # in normal local work. Kept for running the UI on its own port.
  allowed-origins: "${ALLOWED_ORIGINS:http://localhost,http://localhost:3000}"

app:
  frontend:
    reset-password-url: ${FRONTEND_BASE_URL:http://localhost}/reset-password
  password-reset:
    token-ttl-minutes: 30
    resend-cooldown-seconds: 60

# The first admin (docs/mvp/05-components/user-service.md). Empty email = nothing happens.
# If no admin exists yet: this account gets ROLE_ADMIN, or is created with the password if it does not exist.
admin:
  bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    name: ${ADMIN_BOOTSTRAP_NAME:Administrator}

logging:
  pattern:
    # traceId = the X-Request-Id that Nginx adds to every request
    level: "%5p [${spring.application.name},%X{traceId:-}]"

# RabbitMQ events published by this service (docs/mvp/07-events.md).
# The names are settings, so another project can rename them without changing Java.
events:
  exchange: app.events
  registered: user.registered
  password-reset: user.password.reset
  password-changed: user.password.changed
  # The outbox (M46): an event is saved in the database with the change it announces, then sent to RabbitMQ.
  # If RabbitMQ is down, it waits there and is sent later. The body is wiped once the event is sent.
  outbox:
    enabled: true          # false turns off the background retry and cleanup
    retry-interval: 10s    # how often waiting events are tried again
    batch-size: 50         # events per sending round
    keep: 7d               # sent events are deleted after this time

rate-limit:
  enabled: true
  fail-open: false
  trust-proxy-headers: true   # Nginx overwrites X-Forwarded-For with the real client IP

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    ssl: false
    timeout: 2s

  rules:
    login-email: { capacity: 5,  period: 15m }
    login-ip: { capacity: 30, period: 15m }
    register-ip: { capacity: 5,  period: 1h }
    forgot-email: { capacity: 3,  period: 1h }
    forgot-ip: { capacity: 10, period: 1h }
    reset-ip: { capacity: 20, period: 1h }
    validate-ip: { capacity: 30, period: 1h }

captcha:
  enabled: true                                                      # master switch, so you can turn it off in different environments (prod, dev, test)
  provider: turnstile                                                # which implementation to use, for later, so later can swap to reCAPTCHA If needed
  secret-key: ${TURNSTILE_SECRET_KEY}
  verify-url: https://challenges.cloudflare.com/turnstile/v0/siteverify   # Token verification endpoint url
  allowed-hostnames: localhost,127.0.0.1                             # allowed domains for widget to be rendered on