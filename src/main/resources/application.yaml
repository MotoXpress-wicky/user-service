spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update      # TODO: change to none in production


  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}          # your.address@gmail.com
    password: ${MAIL_APP_PASSWORD}      # 16-char app password, spaces removed
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000


  security:
    oauth2:
      client:
        registration:
          google:
            clientId: ${GOOGLE_CLIENT_ID}
            clientSecret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            # Spring listens to this exact URL by default to catch Google's redirect. Do not need to manually create
            # callback route like we do in node.js
            redirectUri: "{baseUrl}/login/oauth2/code/{registrationId}"

auth:
  token:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    ttl-minutes: 1             # 15min
  cookie:
    name: access_token
    path: /
    ttl-minutes: 20160      # 14 days
    secure: false
    same-site: Lax

refresh:
  token:
    ttl-minutes: 20160          # 14 days
  cookie:
    name: refresh_token
    path: /api/auth
    ttl-minutes: 20160          # 14 days
    secure: false
    same-site: Lax

frontend:
  failure-redirect-url: "${FRONTEND_URL:http://localhost:8081}/login"
  success-redirect-url: "${FRONTEND_URL:http://localhost:8081}/"

cors:
  allowed-origins: "${ALLOWED_ORIGINS:http://localhost:8081}"

app:
  mail:
    from-name: "MotoXpress"
  frontend:
    reset-password-url: ${FRONTEND_BASE_URL:http://localhost:8081}/reset-password
  password-reset:
    token-ttl-minutes: 30
    resend-cooldown-seconds: 60

rate-limit:
  enabled: true
  fail-open: false
  trust-proxy-headers: false

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    ssl: false
    timeout: 2s

  rules:
    login-email: { capacity: 5,  period: 15m }
    login-ip: { capacity: 30, period: 15m }
    register-ip: { capacity: 5,  period: 1h }
    forgot-email: { capacity: 3,  period: 1h }
    forgot-ip: { capacity: 10, period: 1h }
    reset-ip: { capacity: 20, period: 1h }
    validate-ip: { capacity: 30, period: 1h }